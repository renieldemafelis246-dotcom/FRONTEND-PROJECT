<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Currency Converter</h1>
            <p>Convert amounts between different currencies</p>
        </header>

        <main class="converter-card">
            <div class="input-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" min="0" step="0.01" placeholder="Enter amount">
                <div id="amount-error" class="error-message"></div>
            </div>

            <div class="currency-group">
                <div class="currency-select">
                    <label for="from-currency">From</label>
                    <select id="from-currency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="PHP">PHP - Philippine Peso</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="KRW">KRW - South Korean Won</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                    </select>
                </div>

                <button id="swap-btn" class="swap-btn">
                    <span>⇄</span>
                </button>

                <div class="currency-select">
                    <label for="to-currency">To</label>
                    <select id="to-currency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="PHP">PHP - Philippine Peso</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="KRW">KRW - South Korean Won</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                    </select>
                </div>
            </div>

            <button id="convert-btn" class="convert-btn">Convert</button>

            <div id="loading-indicator" class="loading-indicator hidden">
                <div class="spinner"></div>
                <p>Fetching exchange rates...</p>
            </div>

            <div id="error-message" class="error-message hidden"></div>

            <div id="result-section" class="result-section hidden">
                <div class="exchange-rate">
                    <p id="exchange-rate-text">1 USD = 58.20 PHP</p>
                </div>
                <div class="conversion-result">
                    <p id="conversion-result-text">₱1,000 PHP = $17.50 USD</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
